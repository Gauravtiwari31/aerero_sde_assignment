[pytest]
testpaths = tests
# Put the project root on sys.path so `import app` resolves without requiring
# an editable install. Without this, pytest only adds rootdir implicitly when
# tests/ lacks an __init__.py, which is too fragile to rely on.
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -ra --strict-markers
markers =
    slow: tests that build large fixtures and take noticeably longer
filterwarnings =
    ignore::DeprecationWarning:pyproj.*
    ignore::DeprecationWarning:pytest_asyncio.*
